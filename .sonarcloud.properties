# SonarQube Cloud automatic-analysis scope for GrindFlow.
# During migration both Laravel and the legacy implementation remain in scope.
sonar.sources=app,bootstrap,config,database,resources,routes,src,workers,scripts,supabase
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,.next/**,storage/**,bootstrap/cache/**,coverage/**,public/**,**/*.min.js
sonar.sourceEncoding=UTF-8
