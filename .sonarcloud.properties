# SonarQube Cloud automatic-analysis scope for GrindFlow.
# Keep this aligned with the code that actually exists on main.
# During the Laravel migration, update these paths only when the corresponding
# Laravel directories have landed in the repository.
sonar.sources=src,workers,scripts,supabase
sonar.tests=tests
sonar.exclusions=node_modules/**,.next/**,coverage/**,public/**,**/*.min.js
sonar.sourceEncoding=UTF-8
