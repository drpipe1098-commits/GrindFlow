# SonarQube Cloud automatic-analysis scope for GrindFlow.
# Prefer the GitHub App automatic analysis. Do not add a duplicate CI scanner
# while automatic analysis is enabled.
sonar.sources=app,bootstrap,config,database,resources,routes
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**,coverage/**
sonar.sourceEncoding=UTF-8
