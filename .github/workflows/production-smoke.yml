name: GrindFlow Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grindflow-production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.grindflow.com.co
      E2E_USER_EMAIL: e2e-admin@grindflow.test
      E2E_USER_PASSWORD: ${{ secrets.PRODUCTION_E2E_PASSWORD }}
      ATTEMPTS: '15'
      WAIT_SECONDS: '20'
    steps:
      - uses: actions/checkout@v4

      - id: credentials
        name: Check synthetic credentials
        shell: bash
        run: |
          if [[ -n "$E2E_USER_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Production E2E credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Production smoke skipped"
              echo
              echo "Repository secret `PRODUCTION_E2E_PASSWORD` is not configured."
              echo "Configure it once in GitHub repository Actions secrets; no SSH is required."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate smoke script
        if: steps.credentials.outputs.configured == 'true'
        run: bash -n scripts/production-smoke.sh

      - name: Authenticated production smoke
        if: steps.credentials.outputs.configured == 'true'
        run: bash scripts/production-smoke.sh

      - name: Publish production result
        if: steps.credentials.outputs.configured == 'true' && success()
        shell: bash
        run: |
          {
            echo "## Production smoke passed"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Target: \`$BASE_URL\`"
            echo "- Checked: \`/up\`, \`/login\`, authenticated \`/dashboard\`, authenticated \`/admin/system\`"
          } >> "$GITHUB_STEP_SUMMARY"
