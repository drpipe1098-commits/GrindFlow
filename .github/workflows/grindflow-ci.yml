name: GrindFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grindflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: '1'
  COMPOSER_NO_AUDIT: '1'

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_php: ${{ steps.scope.outputs.has_php }}
      has_legacy: ${{ steps.scope.outputs.has_legacy }}
      run_php_quality: ${{ steps.scope.outputs.run_php_quality }}
      run_tests: ${{ steps.scope.outputs.run_tests }}
      run_database: ${{ steps.scope.outputs.run_database }}
      run_browser: ${{ steps.scope.outputs.run_browser }}
      run_legacy: ${{ steps.scope.outputs.run_legacy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: scope
        name: Detect project scope
        shell: bash
        run: |
          set -euo pipefail

          has_php=false
          has_legacy=false
          run_php_quality=false
          run_tests=false
          run_database=false
          run_browser=false
          run_legacy=false
          force_all=false

          [[ -f composer.json ]] && has_php=true
          [[ -f package.json ]] && has_legacy=true

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            force_all=true
            CHANGED="[workflow_dispatch]"
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
            else
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"

              if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
                BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
              fi
            fi

            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE"
            fi

            if ! git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$HEAD"
            fi

            CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
            printf '%s\n' "$CHANGED"

            if grep -Eq '^\.github/workflows/grindflow-ci\.yml$' <<<"$CHANGED"; then
              force_all=true
            fi
          fi

          if [[ "$force_all" == "true" ]]; then
            [[ "$has_php" == "true" ]] && run_php_quality=true
            [[ "$has_php" == "true" ]] && run_tests=true
            [[ "$has_php" == "true" ]] && run_database=true
            [[ "$has_php" == "true" ]] && run_browser=true
            [[ "$has_legacy" == "true" ]] && run_legacy=true
          else
            PHP_CORE='^(app/|bootstrap/|config/|database/|routes/|tests/|public/index\.php$|composer\.(json|lock)$|phpstan\.neon(\.dist)?$|phpunit\.xml(\.dist)?$)'
            PHP_TESTS='^(app/|bootstrap/|config/|database/|routes/|tests/|resources/views/|public/index\.php$|composer\.(json|lock)$)'
            DATABASE='^(database/|app/Models/|app/Jobs/|app/Support/Tenancy/|tests/.*(Database|Tenant|MediaVault|Migration|Organization|Membership|Integration)|composer\.(json|lock)$)'
            BROWSER='^(resources/|public/css/|public/index\.php$|app/Http/|app/Livewire/|app/Providers/|config/|routes/web\.php$|tests/Browser/|scripts/browser-smoke\.sh$|composer\.(json|lock)$|playwright\.)'
            LEGACY='^(src/|workers/|supabase/|package\.json$|package-lock\.json$|tsconfig[^/]*\.json$|eslint[^/]*|next\.config[^/]*|postcss[^/]*|tailwind[^/]*|Dockerfile$|workers/Dockerfile$|scripts/.*\.(mjs|js|ts)$)'

            if [[ "$has_php" == "true" ]] && grep -Eq "$PHP_CORE" <<<"$CHANGED"; then
              run_php_quality=true
            fi

            if [[ "$has_php" == "true" ]] && grep -Eq "$PHP_TESTS" <<<"$CHANGED"; then
              run_tests=true
            fi

            if [[ "$has_php" == "true" ]] && grep -Eq "$DATABASE" <<<"$CHANGED"; then
              run_database=true
            fi

            if [[ "$has_php" == "true" ]] && grep -Eq "$BROWSER" <<<"$CHANGED"; then
              run_browser=true
            fi

            if [[ "$has_legacy" == "true" ]] && grep -Eq "$LEGACY" <<<"$CHANGED"; then
              run_legacy=true
            fi
          fi

          echo "has_php=$has_php" >> "$GITHUB_OUTPUT"
          echo "has_legacy=$has_legacy" >> "$GITHUB_OUTPUT"
          echo "run_php_quality=$run_php_quality" >> "$GITHUB_OUTPUT"
          echo "run_tests=$run_tests" >> "$GITHUB_OUTPUT"
          echo "run_database=$run_database" >> "$GITHUB_OUTPUT"
          echo "run_browser=$run_browser" >> "$GITHUB_OUTPUT"
          echo "run_legacy=$run_legacy" >> "$GITHUB_OUTPUT"

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/GRINDFLOW-SPEC.md
          test -f docs/REQUIREMENTS.md
          test -f docs/DEVELOPMENT-MODEL.md
          test -f .coderabbit.yaml
          test -f .sonarcloud.properties
          if [[ -f composer.json ]]; then
            test -f composer.lock
          fi

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/deploy-hostinger.sh ]]; then
            bash -n scripts/deploy-hostinger.sh
          fi

      - name: Validate automation scripts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/sonar-pr-comment.py ]]; then
            python3 -m py_compile scripts/sonar-pr-comment.py
          fi
          if [[ -f scripts/browser-smoke.sh ]]; then
            bash -n scripts/browser-smoke.sh
          fi
          if [[ -f scripts/production-smoke.sh ]]; then
            bash -n scripts/production-smoke.sh
          fi
          if [[ -f scripts/fetch-production-diagnostics.sh ]]; then
            bash -n scripts/fetch-production-diagnostics.sh
          fi

      - name: Publish CI context
        shell: bash
        run: |
          {
            echo "## GrindFlow CI"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- PHP/Laravel present: \`${{ steps.scope.outputs.has_php }}\`"
            echo "- Legacy Node project present: \`${{ steps.scope.outputs.has_legacy }}\`"
            echo "- PHP quality selected: \`${{ steps.scope.outputs.run_php_quality }}\`"
            echo "- PHPUnit selected: \`${{ steps.scope.outputs.run_tests }}\`"
            echo "- Database gate selected: \`${{ steps.scope.outputs.run_database }}\`"
            echo "- Browser gate selected: \`${{ steps.scope.outputs.run_browser }}\`"
            echo "- Legacy gate selected: \`${{ steps.scope.outputs.run_legacy }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  php-quality:
    name: php-quality
    needs: fast
    if: needs.fast.outputs.has_php == 'true' && needs.fast.outputs.run_php_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - id: composer-cache
        name: Locate Composer cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Composer validation
        run: composer validate --strict
      - name: Laravel/PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name '*.php' -print0 2>/dev/null |
            xargs -0 -r -n1 php -l
      - name: Pint
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: tests
    needs: fast
    if: needs.fast.outputs.has_php == 'true' && needs.fast.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - id: composer-cache
        name: Locate Composer cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-
      - run: composer install --prefer-dist --no-progress
      - name: Prepare Laravel environment
        shell: bash
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --force
      - name: Test suite
        shell: bash
        run: |
          if [[ -x vendor/bin/pest ]]; then
            vendor/bin/pest
          else
            vendor/bin/phpunit
          fi

  database:
    name: database
    needs: fast
    if: needs.fast.outputs.has_php == 'true' && needs.fast.outputs.run_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: grindflow_test
          MARIADB_USER: grindflow
          MARIADB_PASSWORD: grindflow
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: grindflow_test
      DB_USERNAME: grindflow
      DB_PASSWORD: grindflow
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - id: composer-cache
        name: Locate Composer cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-
      - run: composer install --prefer-dist --no-progress
      - name: Migrate test database
        shell: bash
        run: |
          cp -n .env.example .env || true
          php artisan key:generate --force
          php artisan migrate:fresh --force
      - name: Database-sensitive tests
        shell: bash
        run: |
          if [[ -x vendor/bin/pest ]]; then
            vendor/bin/pest --group=database || vendor/bin/pest
          else
            vendor/bin/phpunit --group=database
          fi

  browser:
    name: browser
    needs: fast
    if: needs.fast.outputs.has_php == 'true' && needs.fast.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/grindflow-browser.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      BASE_URL: http://127.0.0.1:8000
      E2E_USER_EMAIL: e2e-browser@grindflow.test
      E2E_USER_NAME: E2E Browser User
      E2E_ORG_NAME: E2E Browser Workspace
      E2E_ORG_SLUG: e2e-browser-workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - id: composer-cache
        name: Locate Composer cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Prepare Laravel browser environment
        shell: bash
        run: |
          set -euo pipefail
          cp -n .env.example .env || true
          rm -f /tmp/grindflow-browser.sqlite
          touch /tmp/grindflow-browser.sqlite
          php artisan key:generate --force
          php artisan migrate:fresh --force
          mkdir -p storage/logs tests/Browser/artifacts

          E2E_PASSWORD="$(php -r 'echo bin2hex(random_bytes(24));')"
          echo "E2E_USER_PASSWORD=$E2E_PASSWORD" >> "$GITHUB_ENV"
          export E2E_USER_PASSWORD="$E2E_PASSWORD"

          php artisan db:seed --class='Database\Seeders\E2eSeeder' --force
      - name: Start Laravel
        shell: bash
        run: |
          set -euo pipefail
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/browser-server.log 2>&1 &
          echo $! > /tmp/grindflow-browser-server.pid

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/up >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat storage/logs/browser-server.log >&2 || true
            exit 1
          fi
      - name: Real browser smoke
        run: bash scripts/browser-smoke.sh
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            tests/Browser/artifacts
            storage/logs/browser-server.log
          if-no-files-found: warn
          retention-days: 3
      - name: Stop Laravel
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/grindflow-browser-server.pid ]]; then
            kill "$(cat /tmp/grindflow-browser-server.pid)" 2>/dev/null || true
          fi

  legacy:
    name: legacy
    needs: fast
    if: needs.fast.outputs.has_legacy == 'true' && needs.fast.outputs.run_legacy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Legacy validation during migration
        shell: bash
        run: |
          npm run lint
          npm run typecheck
          npm run test

  validate:
    name: validate
    if: always()
    needs: [fast, php-quality, tests, database, browser, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate gates
        shell: bash
        env:
          FAST: ${{ needs.fast.result }}
          PHP_QUALITY: ${{ needs.php-quality.result }}
          TESTS: ${{ needs.tests.result }}
          DATABASE: ${{ needs.database.result }}
          BROWSER: ${{ needs.browser.result }}
          LEGACY: ${{ needs.legacy.result }}
        run: |
          set -euo pipefail
          printf '%-14s %s\n' fast "$FAST"
          printf '%-14s %s\n' php-quality "$PHP_QUALITY"
          printf '%-14s %s\n' tests "$TESTS"
          printf '%-14s %s\n' database "$DATABASE"
          printf '%-14s %s\n' browser "$BROWSER"
          printf '%-14s %s\n' legacy "$LEGACY"

          for result in "$FAST" "$PHP_QUALITY" "$TESTS" "$DATABASE" "$BROWSER" "$LEGACY"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required GrindFlow CI gate failed or was cancelled."; exit 1 ;;
            esac
          done
