name: Generate Composer Lock

on:
  push:
    branches:
      - chore/php-dependency-lock
    paths:
      - composer.json
      - .github/workflows/generate-composer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/php-dependency-lock

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Generate composer.lock
        run: composer update --no-install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Validate lock
        run: composer validate --strict

      - name: Commit composer.lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already up to date"
            exit 0
          fi
          git commit -m "build: generate Composer lockfile"
          git push origin HEAD:chore/php-dependency-lock
