name: Sonar PR Details

on:
  check_run:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  publish:
    name: publish-pr-comment
    if: >-
      github.event.check_run.app.slug == 'sonarqubecloud' &&
      github.event.check_run.name == 'SonarCloud Code Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Mirror Sonar details into the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/sonar-pr-comment.py
